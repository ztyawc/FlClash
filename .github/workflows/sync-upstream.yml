name: Sync upstream Alpha

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  MAINTENANCE_BRANCH: main

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'MetaCubeX/mihomo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the maintenance branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.26"
          cache: true

      - name: Merge upstream Alpha
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MetaCubeX/mihomo.git
          git fetch --no-tags upstream Alpha:refs/remotes/upstream/Alpha
          if git merge-base --is-ancestor upstream/Alpha HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit upstream/Alpha
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Test the merged tree
        if: steps.merge.outputs.changed == 'true'
        env:
          SKIP_CONCURRENT_TEST: "1"
          SKIP_INTEROP_TEST: "1"
        run: |
          go test ./...
          go test -tags with_gvisor ./transport/socks5 ./adapter/outbound

      - name: Set up Android NDK
        if: steps.merge.outputs.changed == 'true'
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r29-beta1

      - name: Verify Windows and Android builds
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt
          mkdir -p /tmp/mihomo-sync-build
          GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=windows GOARCH=amd64 GOAMD64=v1 \
            go build -tags with_gvisor -trimpath \
            -o /tmp/mihomo-sync-build/mihomo-windows-amd64-v1.exe .
          GOTOOLCHAIN=local CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang" \
            go build -tags with_gvisor -trimpath \
            -o /tmp/mihomo-sync-build/mihomo-android-arm64-v8 .
          git restore --source=HEAD -- component/ca/ca-certificates.crt

      - name: Push the tested merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin "HEAD:${MAINTENANCE_BRANCH}"
