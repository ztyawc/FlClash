name: Build special edition

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
      publish:
        description: Publish the verified release assets
        default: true
        type: boolean
    secrets:
      SPECIAL_ANDROID_KEYSTORE:
        required: true
      SPECIAL_ANDROID_KEYSTORE_PASSWORD:
        required: true

permissions:
  contents: write

concurrency:
  group: build-special-android-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.0"
  GO_VERSION: "1.27.1"
  FLCLASH_SPECIAL_EDITION: "true"

jobs:
  release-state:
    if: github.repository == 'ztyawc/FlClash'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.release.outputs.should-build }}
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Check whether a scheduled retry is needed
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | head -n 1)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          tag="special-${version//+/-}-${short_sha}"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && \
             assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null)" && \
             grep -q '\.apk$' <<< "$assets" && \
             grep -q -- '-windows-amd64-setup\.exe$' <<< "$assets"; then
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    needs: release-state
    if: needs.release-state.outputs.should-build == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Test special-edition workflows
        run: python3 -B -m unittest discover -s test/ci -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare fixed Android signing
        env:
          SPECIAL_ANDROID_KEYSTORE: ${{ secrets.SPECIAL_ANDROID_KEYSTORE }}
          SPECIAL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SPECIAL_ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tool/special_android_signing.py prepare

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Rust for Android
        run: |
          rust_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("plugins/rust_api/rust/rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$rust_version" --profile minimal --target aarch64-linux-android

      - name: Set up libclang for Rust bindings
        run: bash tool/setup_libclang.sh

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Validate Go wrapper
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: |
          go test -count=1 .
          go vet .

      - name: Test CN2 protocols
        working-directory: core/Clash.Meta
        run: go test -count=1 -tags with_gvisor ./transport/vks6 ./transport/uusni ./transport/qyproxy ./transport/socks5 ./adapter ./adapter/outbound ./common/convert ./component/updater

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: bash tool/test_special_flutter.sh

      - name: Fetch CA certificates for Android
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          set -euo pipefail
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build Android arm64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: dart tool/package.dart android --env stable --arch arm64 -v

      - name: Verify and checksum APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json; assert json.load(open("env.json")) == {"APP_ENV": "stable"}, "Expected a stable build environment"'
          mapfile -t apks < <(find dist -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            printf 'Expected 1 arm64 APK, found %s\n' "${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          native_libraries=(libclash.so librust_api.so)
          if [[ -f android/core/src/main/cpp/core.cpp ]]; then
            native_libraries+=(libcore.so)
          fi
          for apk in "${apks[@]}"; do
            badging="$("$aapt" dump badging "$apk")"
            grep -F "package: name='com.follow.clash.dev'" <<< "$badging"
            grep -F "application-label:'FlClash（特供版）'" <<< "$badging"
            libraries="$(unzip -Z1 "$apk")"
            abis="$(sed -n 's@^lib/\([^/]*\)/.*@\1@p' <<< "$libraries" | sort -u)"
            test "$abis" = arm64-v8a
            for library in "${native_libraries[@]}"; do
              grep -Fx "lib/arm64-v8a/$library" <<< "$libraries"
            done
          done
          sha256sum "${apks[@]}" > dist/SHA256SUMS

      - name: Verify fixed APK signatures
        run: python3 tool/special_android_signing.py verify dist/*.apk

      - name: Remove signing material
        if: always()
        run: python3 tool/special_android_signing.py clean

      - name: Upload Android workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-special-android-${{ github.run_id }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
            dist/SIGNING_CERTIFICATE_SHA256
          if-no-files-found: error
          retention-days: 90

  build-windows:
    needs: release-state
    if: needs.release-state.outputs.should-build == 'true'
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Set up Rust for Windows
        shell: bash
        run: |
          set -euo pipefail
          rust_version="$(sed -n 's/^channel = "\(.*\)"$/\1/p' plugins/rust_api/rust/rust-toolchain.toml)"
          test -n "$rust_version"
          rustup toolchain install "$rust_version" --profile minimal --target x86_64-pc-windows-msvc

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: special-windows-amd64
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Go wrapper on Windows
        working-directory: core
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go test -count=1 .
          go vet .

      - name: Test CN2 protocols on Windows
        working-directory: core/Clash.Meta
        shell: bash
        run: go test -count=1 -tags with_gvisor ./transport/vks6 ./transport/uusni ./transport/qyproxy ./transport/socks5 ./adapter ./adapter/outbound ./common/convert ./component/updater

      - name: Test Windows helper
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

      - name: Fetch CA certificates for Windows
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          set -euo pipefail
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build Windows x64 installer
        run: dart tool/package.dart windows --env stable --arch amd64 --targets exe -v

      - name: Verify Windows installer
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '"APP_ENV"[[:space:]]*:[[:space:]]*"stable"' env.json
          bundle_dir="build/windows/x64/runner/Release"
          for required in FlClash.exe FlClashCore.exe FlClashHelperService.exe rust_api.dll EnableLoopback.exe manifest.json; do
            test -s "$bundle_dir/$required"
          done
          mapfile -t zips < <(find dist -maxdepth 1 -type f -name '*.zip' -print)
          if [[ "${#zips[@]}" -ne 0 ]]; then
            printf 'Expected no portable ZIP artifacts, found %s\n' "${#zips[@]}"
            exit 1
          fi
          mapfile -t installers < <(find dist -maxdepth 1 -type f -name '*-windows-amd64-setup.exe' -print | sort)
          if [[ "${#installers[@]}" -ne 1 ]]; then
            printf 'Expected 1 Windows x64 installer EXE, found %s\n' "${#installers[@]}"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          magic="$(head -c 2 "${installers[0]}")"
          test "$magic" = "MZ"

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-special-windows-${{ github.run_id }}
          path: dist/*-windows-amd64-setup.exe
          if-no-files-found: error
          retention-days: 90

  publish:
    needs:
      - build-android
      - build-windows
    if: toJSON(inputs.publish) != 'false'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: FlClash-special-android-${{ github.run_id }}
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: FlClash-special-windows-${{ github.run_id }}
          path: dist

      - name: Create or refresh the stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find dist -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort)
          mapfile -t installers < <(find dist -maxdepth 1 -type f -name '*-windows-amd64-setup.exe' -printf '%f\n' | sort)
          test "${#apks[@]}" -eq 1
          test "${#installers[@]}" -eq 1
          test -s dist/SIGNING_CERTIFICATE_SHA256
          (
            cd dist
            sha256sum "${apks[@]}" "${installers[@]}" > SHA256SUMS
          )
          version="$(sed -n 's/^version: //p' pubspec.yaml | head -n 1)"
          commit_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          core_sha="$(git ls-tree HEAD core/Clash.Meta | awk '$1 == "160000" { print substr($3, 1, 12) }')"
          test -n "$core_sha"
          tag="special-${version//+/-}-${short_sha}"
          notes="${RUNNER_TEMP}/special-release.md"
          {
            printf 'FlClash（特供版）正式版自动构建。\n\n'
            printf -- '- Android 产物：`arm64-v8a` APK（应用 ID：`com.follow.clash.dev`，可与官方版共存）\n'
            printf -- '- Windows 产物：`x64` 安装版 `.exe`\n'
            printf -- '- FlClash：`%s`\n' "$commit_sha"
            printf -- '- mihomo-cn2 内核：`%s`\n' "$core_sha"
            printf -- '- 内核来源：ztyawc/mihomo-cn2，包含 FlClash 接口适配\n'
            printf -- '- 魔改协议：VK S6、UU SNI、QyProxy、CMCC SOCKS5\n'
            printf -- '- Android 签名：固定发布证书（RSA 3072），证书 SHA-256：`%s`\n\n' "$(cat dist/SIGNING_CERTIFICATE_SHA256)"
            printf 'Android 从临时 debug 签名版本切换时，请先导出配置再卸载旧版；此后的固定签名版本可覆盖更新。\n'
          } > "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "FlClash 特供版 ${version}" --notes-file "$notes" --prerelease=false --latest
            gh release upload "$tag" dist/*.apk dist/*-windows-amd64-setup.exe dist/SHA256SUMS dist/SIGNING_CERTIFICATE_SHA256 --clobber
          else
            gh release create "$tag" dist/*.apk dist/*-windows-amd64-setup.exe dist/SHA256SUMS dist/SIGNING_CERTIFICATE_SHA256 \
              --target "$commit_sha" \
              --title "FlClash 特供版 ${version}" \
              --notes-file "$notes" \
              --latest
          fi
