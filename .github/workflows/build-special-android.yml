name: Build special Android

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
      publish:
        description: Publish the verified APKs
        default: true
        type: boolean
    secrets:
      SPECIAL_ANDROID_KEYSTORE:
        required: true
      SPECIAL_ANDROID_KEYSTORE_PASSWORD:
        required: true

permissions:
  contents: write

concurrency:
  group: build-special-android-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.6"
  GO_VERSION: "1.27.1"
  FLCLASH_SPECIAL_EDITION: "true"

jobs:
  release-state:
    if: github.repository == 'ztyawc/FlClash'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.release.outputs.should-build }}
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Check whether a scheduled retry is needed
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | head -n 1)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          tag="special-${version//+/-}-${short_sha}"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && \
             gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release-state
    if: needs.release-state.outputs.should-build == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Test special-edition workflows
        run: python3 -B -m unittest discover -s test/ci -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare fixed Android signing
        env:
          SPECIAL_ANDROID_KEYSTORE: ${{ secrets.SPECIAL_ANDROID_KEYSTORE }}
          SPECIAL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SPECIAL_ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tool/special_android_signing.py prepare

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Rust for Android
        run: |
          rust_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("plugins/rust_api/rust/rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$rust_version" --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up libclang for Rust bindings
        run: bash tool/setup_libclang.sh

      - name: Validate Go wrapper
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: |
          go test -count=1 .
          go vet .

      - name: Test CN2 protocols
        working-directory: core/Clash.Meta
        run: go test -count=1 -tags with_gvisor ./transport/uusni ./transport/qyproxy ./transport/socks5 ./adapter ./adapter/outbound ./common/convert ./component/updater

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: bash tool/test_special_flutter.sh

      - name: Build all Android ABIs
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: dart setup.dart android -v

      - name: Verify and checksum APKs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find dist -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#apks[@]}" -ne 3 ]]; then
            printf 'Expected 3 APKs, found %s\n' "${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          native_libraries=(libclash.so librust_api.so)
          if [[ -f android/core/src/main/cpp/core.cpp ]]; then
            native_libraries+=(libcore.so)
          fi
          for apk in "${apks[@]}"; do
            badging="$("$aapt" dump badging "$apk")"
            grep -F "package: name='com.follow.clash.dev'" <<< "$badging"
            grep -F "application-label:'FlClash（特供版）'" <<< "$badging"
            libraries="$(unzip -Z1 "$apk")"
            for library in "${native_libraries[@]}"; do
              grep -E "^lib/(arm64-v8a|armeabi-v7a|x86_64)/${library//./\\.}$" <<< "$libraries"
            done
          done
          sha256sum "${apks[@]}" > dist/SHA256SUMS

      - name: Verify fixed APK signatures
        run: python3 tool/special_android_signing.py verify dist/*.apk

      - name: Remove signing material
        if: always()
        run: python3 tool/special_android_signing.py clean

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-special-android-${{ github.run_id }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
            dist/SIGNING_CERTIFICATE_SHA256
          if-no-files-found: error
          retention-days: 90

      - name: Create or refresh the prerelease
        if: toJSON(inputs.publish) != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | head -n 1)"
          commit_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          core_sha="$(git -C core/Clash.Meta rev-parse --short=12 HEAD)"
          tag="special-${version//+/-}-${short_sha}"
          notes="${RUNNER_TEMP}/special-release.md"
          {
            printf 'FlClash（特供版）自动构建。\n\n'
            printf -- '- 应用 ID：`com.follow.clash.dev`，可与官方版共存\n'
            printf -- '- FlClash：`%s`\n' "$commit_sha"
            printf -- '- mihomo-cn2 内核：`%s`\n' "$core_sha"
            printf -- '- 内核来源：ztyawc/mihomo-cn2，包含 FlClash 接口适配\n'
            printf -- '- 签名：固定发布证书（RSA 3072）\n'
            printf -- '- 证书 SHA-256：`%s`\n\n' "$(cat dist/SIGNING_CERTIFICATE_SHA256)"
            printf '从临时 debug 签名版本切换时，请先导出配置再卸载旧版；此后的固定签名版本可覆盖更新。\n'
          } > "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "FlClash 特供版 ${version}" --notes-file "$notes"
            gh release upload "$tag" dist/*.apk dist/SHA256SUMS dist/SIGNING_CERTIFICATE_SHA256 --clobber
          else
            gh release create "$tag" dist/*.apk dist/SHA256SUMS dist/SIGNING_CERTIFICATE_SHA256 \
              --target "$commit_sha" \
              --title "FlClash 特供版 ${version}" \
              --notes-file "$notes" \
              --prerelease
          fi
