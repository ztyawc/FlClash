name: Sync special edition

on:
  schedule:
    - cron: "37 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-special-main
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.4"
  GO_VERSION: "1.26.4"

jobs:
  sync-core:
    if: github.repository == 'ztyawc/FlClash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.core-state.outputs.changed }}
      commit: ${{ steps.core-state.outputs.commit }}
    steps:
      - name: Check out the maintained core branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: mihomo
          persist-credentials: false
          ref: core-mihomo

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mihomo/go.sum

      - name: Merge the read-only mihomo source
        id: core-state
        working-directory: mihomo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://github.com/ztyawc/FlClash.git
          git remote remove source 2>/dev/null || true
          git remote add source https://github.com/ztyawc/mihomo.git
          git fetch --no-tags source main:refs/remotes/source/main

          if git merge-base --is-ancestor source/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            previous_head="$(git rev-parse HEAD)"
            git merge --no-commit --no-ff source/main
            git restore --source="$previous_head" --staged --worktree -- .github/workflows
            git commit --no-edit
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test the updated core
        if: steps.core-state.outputs.changed == 'true'
        working-directory: mihomo
        env:
          SKIP_CONCURRENT_TEST: "1"
          SKIP_INTEROP_TEST: "1"
        run: |
          go test ./...
          go test -tags with_gvisor ./transport/socks5 ./adapter/outbound

      - name: Push the tested core branch
        if: steps.core-state.outputs.changed == 'true'
        working-directory: mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:core-mihomo

  sync-app:
    needs: sync-core
    if: needs.sync-core.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.app-state.outputs.changed }}
      commit: ${{ steps.app-state.outputs.commit }}
    steps:
      - name: Check out the special edition
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Merge FlClash upstream
        id: app-merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://github.com/ztyawc/FlClash.git
          git remote remove source 2>/dev/null || true
          git remote add source https://github.com/chen08209/FlClash.git
          git fetch --no-tags source main:refs/remotes/source/main

          if git merge-base --is-ancestor source/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            previous_head="$(git rev-parse HEAD)"
            git merge --no-commit --no-ff source/main
            git restore --source="$previous_head" --staged --worktree -- .github/workflows
            git commit --no-edit
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the embedded core revision
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- core/Clash.Meta
          git submodule update --init core/Clash.Meta
          git -C core/Clash.Meta fetch --no-tags origin core-mihomo
          core_sha="$(git -C core/Clash.Meta rev-parse FETCH_HEAD)"
          git -C core/Clash.Meta checkout --detach "$core_sha"

      - name: Refresh dependencies
        run: |
          (cd core && go mod tidy)
          flutter pub get
          git add core/Clash.Meta core/go.mod core/go.sum pubspec.lock

      - name: Determine whether validation is needed
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.app-merge.outputs.changed }}" == "true" ]] || ! git diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyze Flutter
        if: steps.pending.outputs.changed == 'true'
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        if: steps.pending.outputs.changed == 'true'
        run: flutter test --reporter expanded

      - name: Build Android APKs before promotion
        if: steps.pending.outputs.changed == 'true'
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: dart setup.dart android -v

      - name: Commit dependency revisions
        if: steps.pending.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --cached --quiet; then
            git commit -m "chore: update special edition dependencies"
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo "Validation changed files that were not committed."
            exit 1
          fi

      - name: Record the synchronized revision
        id: app-state
        shell: bash
        run: |
          echo "changed=${{ steps.pending.outputs.changed }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push the tested special edition
        if: steps.pending.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:main

  build:
    needs: sync-app
    if: needs.sync-app.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-special-android.yml
    with:
      ref: ${{ needs.sync-app.outputs.commit }}
