name: Release Ubuntu x86_64

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example v0.1.2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-linux-amd64-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
      SKIP_CONCURRENT_TEST: "1"
      SKIP_INTEROP_TEST: "1"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.26"
          cache: true

      - name: Test
        run: go test ./...

      - name: Test custom protocols with gVisor
        run: go test -tags with_gvisor ./transport/vks6 ./transport/uusni ./transport/qyproxy ./transport/socks5 ./adapter ./adapter/outbound ./common/convert ./component/updater

      - name: Test UU SNI and VK S6 with race detector
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race ./transport/uusni ./transport/vks6
          go test -race ./adapter ./adapter/outbound ./common/convert -run 'UUSNI|VKS6'

      - name: Build Linux amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
        shell: bash
        run: |
          mkdir -p dist
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -tags with_gvisor -trimpath \
            -ldflags "-X github.com/metacubex/mihomo/constant.Version=$RELEASE_TAG -X github.com/metacubex/mihomo/constant.BuildTime=$build_time -w -s -buildid=" \
            -o "dist/mihomo-cn2-linux-amd64-$RELEASE_TAG" .

      - name: Verify executable and example configurations
        shell: bash
        run: |
          binary="dist/mihomo-cn2-linux-amd64-$RELEASE_TAG"
          "$binary" -v
          file "$binary"
          readelf -h "$binary"
          if readelf -l "$binary" | grep -q INTERP; then
            echo "Expected a static executable without a dynamic loader" >&2
            exit 1
          fi
          for config in examples/qyproxy.yaml examples/uusni.yaml examples/vks6.yaml; do
            "$binary" -t -d "$RUNNER_TEMP/mihomo-smoke" -f "$config"
          done

      - name: Package and checksum
        working-directory: dist
        shell: bash
        run: |
          gzip -n -9 "mihomo-cn2-linux-amd64-$RELEASE_TAG"
          sha256sum "mihomo-cn2-linux-amd64-$RELEASE_TAG.gz" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cp .github/release-notes.md "$RUNNER_TEMP/release-notes.md"
          for doc in README.md QYPROXY.md CMCC_SOCKS5.md UUSNI.md VKS6.md VK-S6-PORTING.md; do
            printf '\n[%s](%s/%s/blob/%s/%s)\n' \
              "$doc" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$doc" >> "$RUNNER_TEMP/release-notes.md"
          done
          printf '\n源码提交：`%s`。\n' "$(git rev-parse HEAD)" >> "$RUNNER_TEMP/release-notes.md"
          printf '\n构建工具链：`%s`。\n' "$(go version)" >> "$RUNNER_TEMP/release-notes.md"
          printf '\n[GitHub Actions 构建记录](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            "dist/mihomo-cn2-linux-amd64-$RELEASE_TAG.gz" dist/SHA256SUMS \
            --verify-tag --latest \
            --title "$RELEASE_TAG · QyProxy / CMCC / UU SNI / VK S6 · Ubuntu x86_64" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
